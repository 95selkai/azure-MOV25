<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>Novatrix kundtjänst</title>
<style>
body {
font-family: Arial, sans-serif;
max-width: 600px;
margin: 50px auto;
padding: 20px;
background: #f5f7fa;
}
form {
background: white;
padding: 25px;
border-radius: 10px;
}
label {
display: block;
margin-top: 15px;
}
input, textarea {
width: 100%;
box-sizing: border-box;
padding: 10px;
margin-top: 5px;
}
button {
margin-top: 20px;
padding: 12px 25px;
background: #0066cc;
color: white;
border: none;
cursor: pointer;
}
</style>
</head>
<body>

<h1>Novatrix kundtjänst</h1>
<p>Välkommen! Vi finns här för att hjälpa dig.</p>

<h2>Skicka ett ärende</h2>

<form id="kundtjanstForm">
<label for="namn">Namn:</label>
<input type="text" id="namn" required>

<label for="epost">E-post:</label>
<input type="email" id="epost" required>

<label for="meddelande">Meddelande:</label>
<textarea id="meddelande" rows="5" required></textarea>

<button type="submit">Skicka</button>
</form>

<p id="resultat" role="status"></p>

<script>
const functionUrl = "https://novatrix-v40-ceg6a5cfagbdeed9.swedencentral-01.azurewebsites.net/api/HttpTrigger1?code=FQBTkmzsWoe8KOBERvzRnbAi2MaUDYjsTTyYiTBtVw5aAzFuuW9_vA==";

document.getElementById("kundtjanstForm")
.addEventListener("submit", async function(event) {
event.preventDefault();

const resultat = document.getElementById("resultat");

const data = {
namn: document.getElementById("namn").value,
epost: document.getElementById("epost").value,
meddelande: document.getElementById("meddelande").value
};

resultat.textContent = "Skickar ärendet...";

try {
const response = await fetch(functionUrl, {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify(data)
});

if (!response.ok) {
throw new Error("Fel vid skickning");
}

resultat.textContent = "Ärendet har skickats!";
} catch (error) {
resultat.textContent = "Kunde inte skicka ärendet.";
console.error(error);
}
});
</script>

</body>
</html>
