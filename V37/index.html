<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novatrix kundtjänst</title>

<style>
body {
font-family: Arial, sans-serif;
max-width: 640px;
margin: 40px auto;
padding: 20px;
}

h1 {
color: #2f5496;
}

form {
display: grid;
gap: 12px;
margin-top: 24px;
}

label {
font-weight: bold;
}

input, textarea {
width: 100%;
padding: 8px;
box-sizing: border-box;
}

button {
width: 180px;
padding: 10px;
}
</style>
</head>

<body>

<h1>Novatrix kundtjänst</h1>

<p>Skicka in ett ärende så återkommer vi så snart vi kan.</p>

<form action="/submit" method="post" enctype="multipart/form-data">

<label for="name">Namn</label>
<input type="text" id="name" name="name" required>

<label for="mail">E-post</label>
<input type="email" id="mail" name="mail" required>

<label for="msg">Meddelande</label>
<textarea id="msg" name="msg" rows="5" required></textarea>

<label for="bild">Bifoga en fil</label>
<input type="file" id="bild" name="bild">

<button type="submit">Skicka ärende</button>

</form>

</body>
</html>
